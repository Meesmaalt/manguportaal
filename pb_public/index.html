<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mängude Portaal</title>
    <!-- Tailwind CSS stiilide jaoks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PocketBase JS SDK -->
    <script src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

    <!-- AUTENTIMISE VAADE -->
    <div id="authView" class="flex min-h-screen items-center justify-center p-4">
        <div class="w-full max-w-md bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700">
            <h1 id="authTitle" class="text-2xl font-bold text-amber-500 mb-6 text-center">Sisselogimine</h1>
            
            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">E-post või kasutajanimi</label>
                    <input type="text" id="identity" required class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Parool</label>
                    <input type="password" id="password" required class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-amber-500">
                </div>
                <button type="submit" id="authSubmitBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-lg transition-colors">
                    Logi sisse
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-slate-400">
                <span id="toggleText">Puudub konto?</span>
                <button onclick="toggleAuthMode()" class="text-amber-500 hover:underline font-semibold ml-1" id="toggleBtn">Registreeru</button>
            </div>
        </div>
    </div>

    <!-- JUHTIMISPANEELI VAADE -->
    <div id="dashboardView" class="hidden min-h-screen p-6 max-w-6xl mx-auto space-y-8">
        <!-- Päis -->
        <header class="flex justify-between items-center pb-6 border-b border-slate-800">
            <div>
                <h1 class="text-3xl font-extrabold text-amber-500">🎮 Mängud</h1>
                <p class="text-slate-400 text-sm">Tere tulemast, <span id="userEmail" class="text-white font-medium"></span>!</p>
            </div>
            <button onclick="logout()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm font-medium transition-colors border border-slate-700">
                Logi välja
            </button>
        </header>

        <!-- Uue mängu loomise kaart -->
        <section class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg">
            <h2 class="text-lg font-bold text-white mb-4">Loo uus mäng</h2>
            <form onsubmit="createGame(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="newTitle" placeholder="Mängu pealkiri (nt 'Jani 30. sünnipäev')" required class="bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-amber-500">
                
                <select id="newType" class="bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-amber-500">
                    <option value="kuldvillak">Kuldvillak</option>
                    <option value="roosidesoda">Rooside Sõda</option>
                </select>

                <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 rounded-lg transition-colors">
                    + Lisa mäng
                </button>
            </form>
        </section>

        <!-- Salvestatud mängude nimekiri -->
        <section>
            <h2 class="text-xl font-bold text-white mb-4">Minu salvestatud mängud</h2>
            <div id="gamesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Mängu kaardid ilmuvad siia -->
            </div>
        </section>
    </div>

    <script>
        const pb = new PocketBase(window.location.origin);
        let isLogin = true;

        // Kontrolli sessiooni lehe laadimisel
        if (pb.authStore.isValid) {
            showDashboard();
        }

        function toggleAuthMode() {
            isLogin = !isLogin;
            document.getElementById('authTitle').innerText = isLogin ? 'Sisselogimine' : 'Registreerimine';
            document.getElementById('authSubmitBtn').innerText = isLogin ? 'Logi sisse' : 'Loo konto';
            document.getElementById('toggleText').innerText = isLogin ? 'Puudub konto?' : 'Konto olemas?';
            document.getElementById('toggleBtn').innerText = isLogin ? 'Registreeru' : 'Logi sisse';
        }

        async function handleAuth(e) {
            e.preventDefault();
            const identity = document.getElementById('identity').value;
            const password = document.getElementById('password').value;

            try {
                if (isLogin) {
                    await pb.collection('users').authWithPassword(identity, password);
                } else {
                    await pb.collection('users').create({
                        email: identity,
                        password: password,
                        passwordConfirm: password,
                    });
                    await pb.collection('users').authWithPassword(identity, password);
                }
                showDashboard();
            } catch (err) {
                alert('Tõrge: ' + err.message);
            }
        }

        function logout() {
            pb.authStore.clear();
            document.getElementById('authView').classList.remove('hidden');
            document.getElementById('dashboardView').classList.add('hidden');
        }

        function showDashboard() {
            document.getElementById('authView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            document.getElementById('userEmail').innerText = pb.authStore.model.email;
            loadGames();
        }

        async function loadGames() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '<p class="text-slate-500 col-span-full">Laen mänge...</p>';

            try {
                const records = await pb.collection('games').getFullList({
                    sort: '-created',
                    filter: `user = "${pb.authStore.model.id}"`
                });

                grid.innerHTML = '';

                if (records.length === 0) {
                    grid.innerHTML = '<p class="text-slate-500 col-span-full">Sul pole veel ühtegi salvestatud mängu.</p>';
                    return;
                }

                records.forEach(game => {
                    const typeLabel = game.game_type === 'kuldvillak' ? 'Kuldvillak' : 'Rooside Sõda';
                    const badgeColor = game.game_type === 'kuldvillak' ? 'bg-amber-500/10 text-amber-500 border-amber-500/20' : 'bg-rose-500/10 text-rose-500 border-rose-500/20';

                    const card = document.createElement('div');
                    card.className = 'bg-slate-800 border border-slate-700 rounded-2xl p-5 flex flex-col justify-between shadow-md hover:border-slate-600 transition-all';
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <span class="text-xs font-bold px-2.5 py-1 rounded-full border ${badgeColor}">
                                    ${typeLabel}
                                </span>
                                <small class="text-slate-500 text-xs">${new Date(game.created).toLocaleDateString()}</small>
                            </div>
                            <h3 class="text-lg font-bold text-white mb-2">${game.title}</h3>
                        </div>
                        <div class="flex gap-2 mt-6">
                            <button onclick="playGame('${game.game_type}', '${game.id}')" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 text-sm font-bold py-2 rounded-lg transition-colors">
                                Mängi / Halda
                            </button>
                            <button onclick="renameGame('${game.id}', '${game.title.replace(/'/g, "\\'")}')" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-2 rounded-lg text-sm transition-colors" title="Muuda pealkirja">
                                ✏️
                            </button>
                            <button onclick="duplicateGame('${game.id}')" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-2 rounded-lg text-sm transition-colors" title="Dubleeri (loo koopia korduskasutuseks)">
                                📄
                            </button>
                            <button onclick="deleteGame('${game.id}')" class="bg-slate-700 hover:bg-red-500/20 hover:text-red-400 text-slate-400 px-3 py-2 rounded-lg text-sm transition-colors" title="Kustuta">
                                🗑
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function createGame(e) {
            e.preventDefault();
            const title = document.getElementById('newTitle').value;
            const game_type = document.getElementById('newType').value;

            // Algandmed mängutüübi järgi
            const defaultData = game_type === 'kuldvillak' 
                ? [ { category: "Esimene kategooria", questions: [ { points: 100, q: "Küsimus?", a: "Vastus" } ] } ]
                : { rounds: [] };

            try {
                await pb.collection('games').create({
                    title: title,
                    game_type: game_type,
                    data: defaultData,
                    user: pb.authStore.model.id
                });
                document.getElementById('newTitle').value = '';
                loadGames();
            } catch (err) {
                alert('Mängu loomine ebaõnnestus: ' + err.message);
            }
        }

        async function deleteGame(id) {
            if (!confirm('Kas oled kindel, et soovid selle mängu kustutada?')) return;
            try {
                await pb.collection('games').delete(id);
                loadGames();
            } catch (err) {
                alert('Kustutamine ebaõnnestus: ' + err.message);
            }
        }

        async function renameGame(id, currentTitle) {
            const newTitle = prompt('Uus pealkiri:', currentTitle);
            if (!newTitle || newTitle.trim() === '' || newTitle === currentTitle) return;
            try {
                await pb.collection('games').update(id, { title: newTitle.trim() });
                loadGames();
            } catch (err) {
                alert('Ümbernimetamine ebaõnnestus: ' + err.message);
            }
        }

        async function duplicateGame(id) {
            try {
                const original = await pb.collection('games').getOne(id);
                await pb.collection('games').create({
                    title: original.title + ' (koopia)',
                    game_type: original.game_type,
                    data: original.data,
                    user: pb.authStore.model.id,
                });
                loadGames();
            } catch (err) {
                alert('Dubleerimine ebaõnnestus: ' + err.message);
            }
        }

        const GAME_PATHS = {
            kuldvillak: 'kuldvillak.html',
            roosidesoda: 'roosidesoda/roosidesoda-admin.html',
        };

        function playGame(type, id) {
            // Suunab vastava mängu lehele koos mängu ID-ga URL-is
            const path = GAME_PATHS[type] || `${type}.html`;
            window.location.href = `${path}?id=${id}`;
        }
    </script>
</body>
</html>
