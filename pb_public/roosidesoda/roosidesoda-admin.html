<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooside Sõda - Juhtimiskeskus</title>
    <script src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap');

        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --gold: #f5b027;
            --red: #e62e4d;
            --green: #22c55e;
            --blue: #3b82f6;
            --text: #f8fafc;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        h1 { color: var(--gold); text-align: center; margin-top: 0; font-size: 1.8rem; }

        .top-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            background: var(--panel);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid rgba(245, 176, 39, 0.3);
        }

        .ctrl-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 900px) { .ctrl-grid { grid-template-columns: 1fr; } }

        .box {
            background: var(--panel);
            border: 2px solid rgba(245, 176, 39, 0.3);
            border-radius: 12px;
            padding: 15px;
        }

        .btn {
            background: var(--gold);
            color: black;
            border: none;
            padding: 8px 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-red { background: var(--red); color: white; }
        .btn-green { background: var(--green); color: white; }
        .btn-blue { background: var(--blue); color: white; }

        .ans-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .ans-table th, .ans-table td { border: 1px solid #334155; padding: 10px; text-align: left; }
        .ans-table th { background: #334155; color: var(--gold); }
        
        .ans-row { cursor: pointer; }
        .ans-row:hover { background: rgba(245, 176, 39, 0.1); }
        .ans-row.revealed { background: rgba(34, 197, 94, 0.2); }

        .strike-btns { display: flex; gap: 10px; margin-top: 10px; }
        .strike-btns button { flex: 1; padding: 12px; font-size: 1.2rem; }

        .round-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal { background: var(--panel); padding: 25px; border-radius: 12px; width: 90%; max-width: 750px; max-height: 85vh; overflow-y: auto; border: 2px solid var(--gold); }
        .admin-input { background: #0f172a; border: 1px solid var(--gold); color: white; padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; margin-bottom: 8px; }
        .round-card { background: #0f172a; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; }
    </style>
</head>
<body>

    <h1>🎛️ ROOSIDE SÕDA - JUHTPULT <span id="gameTitle" style="color:#94a3b8; font-size:1rem;"></span></h1>

    <div class="top-bar">
        <a href="../index.html" class="btn" style="text-decoration:none;" title="Tagasi mängude nimekirja">⬅ Mängud</a>
        <button class="btn btn-blue" onclick="openDisplay()">🖥️ Ava Mänguekraan</button>
        <button class="btn" onclick="openAdminModal()">⚙️ Redaktor & Eksport/Import</button>
        <button class="btn btn-red" onclick="resetGame()">🔄 Nulli Mäng</button>
        
        <span style="color: var(--gold); margin-left: 10px;">Tekst:</span>
        <button class="btn" onclick="changeFont(-0.1)">A-</button>
        <button class="btn" onclick="changeFont(0.1)">A+</button>

        <span style="color: var(--gold); margin-left: 10px;">🔊 Helitugevus:</span>
        <input type="range" id="volSlider" min="0" max="1" step="0.05" value="0.8" oninput="updateVolume(this.value)">
        <button class="btn btn-blue" id="bgmBtn" onclick="toggleBgm()">🎵 Taustamuusika: VÄLJAS</button>
        <span id="saveStatus" style="color: var(--gold); font-size: 0.85rem;"></span>
    </div>

    <div class="ctrl-grid">
        <!-- Vasak pool: Mängu juhtimine -->
        <div class="box">
            <div class="round-nav">
                <button class="btn" onclick="prevRound()">◄ Eelmine</button>
                <h2 id="roundTitle" style="margin: 0; color: var(--gold);">VOOR 1</h2>
                <button class="btn" onclick="nextRound()">Järgmine ►</button>
            </div>

            <h3 id="questionBox" style="color: #cbd5e1; margin-top: 5px;">Küsimus...</h3>

            <h4>Klikka vastusel selle avamiseks peaeekraanil:</h4>
            <table class="ans-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Vastus</th>
                        <th>Punkte (Kordajaga)</th>
                        <th>Olek</th>
                    </tr>
                </thead>
                <tbody id="ansTableBody"></tbody>
            </table>

            <h4 style="margin-top: 20px;">Eksimused (X / Buzzer):</h4>
            <div class="strike-btns">
                <button class="btn btn-red" onclick="triggerStrike(1)">❌ 1X</button>
                <button class="btn btn-red" onclick="triggerStrike(2)">❌❌ 2X</button>
                <button class="btn btn-red" onclick="triggerStrike(3)">❌❌❌ 3X</button>
            </div>
        </div>

        <!-- Parem pool: Skoorid ja Pank -->
        <div class="box" style="display: flex; flex-direction: column; gap: 15px;">
            <div style="text-align: center; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px dashed var(--gold);">
                <span style="color: #94a3b8; font-weight: bold;">PUNKTI PANK:</span>
                <div id="bankScore" style="font-size: 2.5rem; color: var(--gold); font-weight: 900;">0</div>
            </div>

            <div style="background: #0f172a; padding: 15px; border-radius: 8px;">
                <input class="admin-input" id="teamName0" onchange="updateTeamNames()" style="font-weight: bold; font-size: 1.1rem; color: var(--gold);">
                <div id="teamScore0" style="font-size: 2rem; font-weight: bold;">0</div>
                <button class="btn btn-green" style="width: 100%; margin-top: 5px;" onclick="awardBank(0)">Kanna Pank Tiimile 1</button>
            </div>

            <div style="background: #0f172a; padding: 15px; border-radius: 8px;">
                <input class="admin-input" id="teamName1" onchange="updateTeamNames()" style="font-weight: bold; font-size: 1.1rem; color: var(--gold);">
                <div id="teamScore1" style="font-size: 2rem; font-weight: bold;">0</div>
                <button class="btn btn-green" style="width: 100%; margin-top: 5px;" onclick="awardBank(1)">Kanna Pank Tiimile 2</button>
            </div>
        </div>
    </div>

    <!-- Admin & Import/Export Modal -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal">
            <h2 style="color: var(--gold); text-align: center; margin-top:0;">⚙️ Küsimuste Redaktor & Eksport/Import</h2>
            
            <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; background: #0f172a; padding: 12px; border-radius: 8px;">
                <button class="btn btn-blue" onclick="exportQuestions()">📥 Ekspordi Küsimused (JSON)</button>
                <button class="btn btn-blue" onclick="document.getElementById('importFile').click()">📤 Impordi Küsimused</button>
                <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importQuestions(event)">
                <button class="btn" onclick="addNewRound()">+ Lisa Voor</button>
            </div>

            <div id="adminRoundsContainer"></div>

            <div style="text-align: center; margin-top: 15px;">
                <button class="btn btn-green" onclick="closeAdminModal()">Salvesta & Sulge</button>
            </div>
        </div>
    </div>

    <script>
        const defaultRounds = [
            {
                title: "VOOR 1", multiplier: 1, question: "Nimeta midagi, mida inimesed tihti kaotavad?",
                answers: [
                    { text: "Võtmed", points: 42, revealed: false },
                    { text: "Mobiiltelefon", points: 28, revealed: false },
                    { text: "Prillid", points: 14, revealed: false },
                    { text: "Raha / Rahakott", points: 9, revealed: false },
                    { text: "Mõistus / Kannatus", points: 5, revealed: false }
                ]
            },
            {
                title: "VOOR 2", multiplier: 1, question: "Mis on esimene asi, mida teed hommikul ärgates?",
                answers: [
                    { text: "Avan silmad", points: 38, revealed: false },
                    { text: "Käin tualetis", points: 25, revealed: false },
                    { text: "Vaatan telefoni", points: 18, revealed: false },
                    { text: "Joon kohvi", points: 12, revealed: false }
                ]
            },
            {
                title: "VOOR 3", multiplier: 2, question: "Nimeta toit, mida süüakse tavaliselt kätega?",
                answers: [
                    { text: "Pitsa", points: 45, revealed: false },
                    { text: "Burger", points: 30, revealed: false },
                    { text: "Friikartulid", points: 12, revealed: false }
                ]
            }
        ];

        // --- POCKETBASE ÜHENDUS ---
        const pb = new PocketBase(window.location.origin);
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('id');
        // Iga salvestatud mäng saab oma localStorage "nimeruumi", et mitu
        // eri Rooside Sõja seadistust ei läheks omavahel segamini.
        const STORAGE_PREFIX = gameId ? `feud_${gameId}_` : 'feud_local_';

        let rounds = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'rounds')) || defaultRounds;
        let teams = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'teams')) || [{name:'TIIM 1', score:0}, {name:'TIIM 2', score:0}];
        let currentRound = parseInt(localStorage.getItem(STORAGE_PREFIX + 'currentRound')) || 0;
        let bankScore = parseInt(localStorage.getItem(STORAGE_PREFIX + 'bankScore')) || 0;
        let fontScale = parseFloat(localStorage.getItem(STORAGE_PREFIX + 'fontScale')) || 1.0;
        let volume = parseFloat(localStorage.getItem(STORAGE_PREFIX + 'volume')) ?? 0.8;
        let bgmActive = localStorage.getItem(STORAGE_PREFIX + 'bgm_active') === 'true';

        function sync() {
            localStorage.setItem(STORAGE_PREFIX + 'rounds', JSON.stringify(rounds));
            localStorage.setItem(STORAGE_PREFIX + 'teams', JSON.stringify(teams));
            localStorage.setItem(STORAGE_PREFIX + 'currentRound', currentRound);
            localStorage.setItem(STORAGE_PREFIX + 'bankScore', bankScore);
            localStorage.setItem(STORAGE_PREFIX + 'fontScale', fontScale);
            localStorage.setItem(STORAGE_PREFIX + 'volume', volume);
            localStorage.setItem(STORAGE_PREFIX + 'bgm_active', bgmActive);
            render();
        }

        function sendSignal(type, val = '') {
            localStorage.setItem(STORAGE_PREFIX + type, val + '_' + Date.now());
        }

        function openDisplay() {
            const url = gameId ? `index.html?id=${gameId}` : 'index.html';
            window.open(url, '_blank');
        }

        // Laeb salvestatud voorud PocketBase'ist, kui juhtpult avati portaalist
        // (?id=... URL-is). Ilma id-ta töötab fail jätkuvalt iseseisvalt.
        async function loadFromPocketBase() {
            if (!gameId) return;
            const statusEl = document.getElementById('saveStatus');
            try {
                const record = await pb.collection('games').getOne(gameId);
                document.getElementById('gameTitle').innerText = record.title ? `— ${record.title}` : '';
                if (record.data && Array.isArray(record.data.rounds)) {
                    rounds = record.data.rounds;
                    sync();
                }
            } catch (err) {
                console.error(err);
                if (statusEl) statusEl.innerText = '⚠️ Salvestatud seadistuse laadimine ebaõnnestus';
            }
        }

        // Saadab hetke voorud/küsimused PocketBase'i tagasi. Kutsutakse siis,
        // kui host redaktori sulgeb — skoorid/pank/hetke voor jäävad ainult
        // selle arvuti localStorage'isse (ajutine mänguseis).
        async function saveToPocketBase() {
            if (!gameId) return;
            const statusEl = document.getElementById('saveStatus');
            try {
                if (statusEl) statusEl.innerText = '💾 Salvestan...';
                await pb.collection('games').update(gameId, { data: { rounds } });
                if (statusEl) {
                    statusEl.innerText = '✅ Salvestatud';
                    setTimeout(() => { statusEl.innerText = ''; }, 2500);
                }
            } catch (err) {
                console.error(err);
                if (statusEl) statusEl.innerText = '⚠️ Salvestamine ebaõnnestus';
            }
        }

        function render() {
            const r = rounds[currentRound] || rounds[0];
            const mult = r.multiplier || 1;
            document.getElementById('roundTitle').innerText = `${r.title} (${mult}x Kordaja)`;
            document.getElementById('questionBox').innerText = r.question;
            document.getElementById('bankScore').innerText = bankScore;

            document.getElementById('teamName0').value = teams[0].name;
            document.getElementById('teamScore0').innerText = teams[0].score;
            document.getElementById('teamName1').value = teams[1].name;
            document.getElementById('teamScore1').innerText = teams[1].score;

            document.getElementById('volSlider').value = volume;
            const bgmBtn = document.getElementById('bgmBtn');
            bgmBtn.innerText = bgmActive ? '🎵 Taustamuusika: SEES' : '🎵 Taustamuusika: VÄLJAS';
            bgmBtn.className = bgmActive ? 'btn btn-green' : 'btn btn-blue';

            const tbody = document.getElementById('ansTableBody');
            tbody.innerHTML = '';

            r.answers.forEach((a, i) => {
                const tr = document.createElement('tr');
                tr.className = `ans-row ${a.revealed ? 'revealed' : ''}`;
                tr.onclick = () => toggleAnswer(i);
                tr.innerHTML = `
                    <td>${i + 1}</td>
                    <td><b>${a.text}</b></td>
                    <td>${a.points * mult} <small style="color:#94a3b8">(${a.points} x ${mult})</small></td>
                    <td>${a.revealed ? '✅ Avatud' : '🔒 Peidetud'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleAnswer(idx) {
            const r = rounds[currentRound];
            const mult = r.multiplier || 1;
            if (!r.answers[idx].revealed) {
                r.answers[idx].revealed = true;
                bankScore += (r.answers[idx].points * mult);
                sendSignal('trigger_sound', 'ding');
            } else {
                r.answers[idx].revealed = false;
                bankScore -= (r.answers[idx].points * mult);
            }
            sync();
        }

        function triggerStrike(count) { sendSignal('trigger_strike', count); }

        function awardBank(teamIdx) {
            teams[teamIdx].score += bankScore;
            bankScore = 0;
            sendSignal('trigger_sound', 'confetti');
            sync();
        }

        function nextRound() { if (currentRound < rounds.length - 1) { currentRound++; bankScore = 0; sync(); } }
        function prevRound() { if (currentRound > 0) { currentRound--; bankScore = 0; sync(); } }

        function updateTeamNames() {
            teams[0].name = document.getElementById('teamName0').value;
            teams[1].name = document.getElementById('teamName1').value;
            sync();
        }

        function changeFont(d) { fontScale = Math.min(Math.max(0.7, fontScale + d), 1.5); sync(); }
        
        function updateVolume(val) { volume = parseFloat(val); sync(); }

        function toggleBgm() { bgmActive = !bgmActive; sync(); }

        function resetGame() {
            if (confirm("Kas soovid tõesti kogu mängu nullida? (Skoorid ja avatud vastused nollitakse)")) {
                rounds.forEach(r => r.answers.forEach(a => a.revealed = false));
                teams.forEach(t => t.score = 0);
                bankScore = 0;
                currentRound = 0;
                sync();
            }
        }

        // Admin Modal & Question Redactor
        function openAdminModal() { renderAdmin(); document.getElementById('adminModal').style.display = 'flex'; }
        function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; sync(); saveToPocketBase(); }

        function renderAdmin() {
            const c = document.getElementById('adminRoundsContainer');
            c.innerHTML = '';
            rounds.forEach((r, rI) => {
                let html = `<div class="round-card">
                    <div style="display:flex; gap:10px; margin-bottom:8px;">
                        <input class="admin-input" style="flex:2;" value="${r.title}" placeholder="Vooru pealkiri" onchange="rounds[${rI}].title=this.value">
                        <div style="display:flex; align-items:center; gap:5px; white-space:nowrap;">
                            <label style="color:var(--gold); font-weight:bold;">Kordaja:</label>
                            <input class="admin-input" type="number" min="1" max="10" style="width:60px; margin:0;" value="${r.multiplier || 1}" onchange="rounds[${rI}].multiplier=parseInt(this.value)||1">
                        </div>
                        <button class="btn btn-red" onclick="deleteRound(${rI})">🗑️ Delete</button>
                    </div>
                    <input class="admin-input" value="${r.question}" placeholder="Küsimus" onchange="rounds[${rI}].question=this.value">`;
                
                r.answers.forEach((a, aI) => {
                    html += `<div style="display:flex; gap:5px;">
                        <input class="admin-input" value="${a.text}" placeholder="Vastus" onchange="rounds[${rI}].answers[${aI}].text=this.value">
                        <input class="admin-input" type="number" style="width:80px;" value="${a.points}" placeholder="Punktid" onchange="rounds[${rI}].answers[${aI}].points=parseInt(this.value)||0">
                        <button class="btn btn-red" style="padding:4px 8px; margin-bottom:8px;" onclick="rounds[${rI}].answers.splice(${aI},1); renderAdmin();">X</button>
                    </div>`;
                });
                html += `<button class="btn" onclick="rounds[${rI}].answers.push({text:'Uus vastus', points:10, revealed:false}); renderAdmin();">+ Lisa Vastus</button></div>`;
                c.innerHTML += html;
            });
        }

        function addNewRound() {
            rounds.push({ title: `VOOR ${rounds.length + 1}`, multiplier: 1, question: "Uus küsimus?", answers: [{ text: "Vastus 1", points: 10, revealed: false }] });
            renderAdmin();
        }

        function deleteRound(rI) {
            if (confirm("Kas kustutada see voor?")) {
                rounds.splice(rI, 1);
                if (currentRound >= rounds.length) currentRound = Math.max(0, rounds.length - 1);
                renderAdmin();
            }
        }

        // Export & Import
        function exportQuestions() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(rounds, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "rooside_soda_kysimused.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importQuestions(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        rounds = imported;
                        currentRound = 0;
                        bankScore = 0;
                        sync();
                        renderAdmin();
                        alert("Küsimused edukalt imporditud!");
                    } else {
                        alert("Vigane JSON formaat!");
                    }
                } catch (err) {
                    alert("Faili lugemisel tekkis viga!");
                }
            };
            fileReader.readAsText(event.target.files[0]);
        }

        window.onload = () => { render(); loadFromPocketBase(); };
    </script>
</body>
</html>
