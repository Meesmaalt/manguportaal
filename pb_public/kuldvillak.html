<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sünnipäeva Kuldvillak - Juhtimiskeskus</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@500;700;900&display=swap');

        :root {
            --bg-color: #030a16;
            --card-bg: rgba(10, 25, 47, 0.85);
            --gold: #dfb342;
            --gold-hover: #fce79a;
            --text-light: #f0f4f8;
            --accent-blue: #1e3a8a;
            --accent-cyan: #38bdf8;
            --accent-red: #a82f2f;
            --accent-green: #2e7d32;
            --font-scale: 1; /* Dünaamiline skaleerimine */
        }

        html {
            font-size: calc(16px * var(--font-scale));
        }

        body {
            background: radial-gradient(circle at center, #0a1b36 0%, #081426 60%, #030a16 100%);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
        }

        #bgCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Top Bar Controls */
        .top-bar {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 100;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .font-controls {
            display: flex;
            gap: 4px;
            background: rgba(10, 25, 47, 0.85);
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 2px 8px;
            align-items: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 10px rgba(15, 23, 42, 0.8);
        }

        .font-btn {
            background: transparent;
            border: none;
            color: var(--gold);
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .font-btn:hover {
            background: var(--gold);
            color: black;
        }

        .ctrl-btn {
            background: rgba(10, 25, 47, 0.85);
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(223, 179, 66, 0.3), inset 0 0 10px rgba(30, 58, 138, 0.5);
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }
        .ctrl-btn:hover {
            background: var(--gold);
            color: black;
            box-shadow: 0 0 25px rgba(223, 179, 66, 0.8);
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            text-align: center;
            font-size: 2.8rem;
            margin: 5px 0 20px 0;
            text-shadow: 0 0 20px rgba(223, 179, 66, 0.6), 0 0 40px rgba(56, 189, 248, 0.3);
            letter-spacing: 2px;
        }

        .board {
            display: grid;
            gap: 12px;
            width: 100%;
            max-width: 1400px;
            margin-bottom: 25px;
            z-index: 1;
        }

        .category-header {
            background: linear-gradient(180deg, rgba(30, 58, 138, 0.9), rgba(10, 25, 47, 0.95));
            border: 2px solid var(--gold);
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-weight: 900;
            text-align: center;
            padding: 12px 5px;
            font-size: 1.1rem;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.8), inset 0 0 15px rgba(56, 189, 248, 0.2);
            text-shadow: 1px 1px 3px black;
            min-height: 45px;
            backdrop-filter: blur(5px);
        }

        .card {
            background: linear-gradient(145deg, rgba(15, 30, 60, 0.9), rgba(8, 20, 38, 0.95));
            border: 2px solid var(--gold);
            border-radius: 12px;
            height: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--gold);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 15px rgba(0,0,0,0.6), inset 0 0 10px rgba(30, 58, 138, 0.4);
            backdrop-filter: blur(5px);
            position: relative;
        }

        .card:hover {
            background: var(--gold);
            color: var(--bg-color);
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 10px 30px rgba(223, 179, 66, 0.7), 0 0 20px rgba(56, 189, 248, 0.5);
        }

        .card.disabled {
            background: rgba(4, 10, 20, 0.6);
            border-color: rgba(30, 58, 138, 0.3);
            color: transparent;
            cursor: default;
            transform: none;
            box-shadow: none;
        }

        /* Admin Hint card style */
        .host-active .card.disabled {
            color: rgba(255,255,255,0.15) !important;
        }
        .admin-answer-preview {
            display: none;
            font-size: 0.75rem;
            font-family: 'Montserrat', sans-serif;
            color: #5cf161;
            padding: 4px;
            text-align: center;
            word-break: break-word;
            line-height: 1.1;
            font-weight: bold;
        }
        .host-active .admin-answer-preview {
            display: block;
        }

        .scoreboard-container {
            width: 100%;
            max-width: 1200px;
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 1;
        }

        .team-management-tools {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-sm {
            padding: 6px 16px;
            font-size: 0.85rem;
            border-radius: 20px;
            background: rgba(10, 25, 47, 0.85);
            border: 1px solid var(--gold);
            color: var(--gold);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
        }
        .btn-sm:hover {
            background: var(--gold);
            color: black;
            box-shadow: 0 0 10px rgba(223, 179, 66, 0.5);
        }

        .scoreboard {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .team {
            background: linear-gradient(135deg, rgba(10, 25, 47, 0.9), rgba(15, 35, 65, 0.85));
            border: 2px solid rgba(223, 179, 66, 0.5);
            border-radius: 12px;
            padding: 12px 15px;
            text-align: center;
            flex: 1;
            min-width: 140px;
            max-width: 220px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6), inset 0 0 10px rgba(30, 58, 138, 0.3);
            backdrop-filter: blur(8px);
        }

        .team-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 5px;
            cursor: pointer;
            border-bottom: 1px dashed transparent;
            display: inline-block;
        }

        .team-score {
            font-size: 2.4rem;
            font-family: 'Cinzel', serif;
            margin: 5px 0;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(223, 179, 66, 0.4);
        }

        .team-controls button {
            background: rgba(30, 58, 138, 0.8);
            color: white;
            border: 1px solid var(--gold);
            padding: 4px 14px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 0 3px;
        }
        .team-controls button:hover { background: var(--gold); color: black; }

        /* Modal Settings */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 10, 22, 0.88);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(12px);
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .modal {
            background: linear-gradient(145deg, rgba(10, 25, 47, 0.98), rgba(6, 16, 32, 0.98));
            border: 3px solid var(--gold);
            border-radius: 16px;
            padding: 35px;
            width: 90%;
            max-width: 850px;
            text-align: center;
            box-shadow: 0 0 60px rgba(223, 179, 66, 0.3), inset 0 0 20px rgba(30, 58, 138, 0.5);
            transform: scale(0.85);
            transition: transform 0.25s ease;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal.show { transform: scale(1); }

        .modal-category {
            font-family: 'Cinzel', serif;
            color: #38bdf8;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .modal-points {
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .modal-question {
            font-size: 1.8rem;
            margin: 20px 0;
            line-height: 1.4;
            font-weight: 700;
        }

        .modal-answer {
            font-size: 1.6rem;
            color: #5cf161;
            margin: 20px 0;
            display: none;
            padding: 15px;
            background: rgba(0, 255, 0, 0.08);
            border-radius: 10px;
            border: 2px solid #5cf161;
            font-weight: 900;
        }

        .btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 12px 24px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 8px;
            margin: 8px 4px;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn:hover { background: var(--gold-hover); transform: translateY(-2px); }
        .btn-close { background: var(--accent-red); color: white; }
        .btn-close:hover { background: #c43838; }

        .award-buttons {
            display: none;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .btn-team { background: #1e3a8a; color: white; border: 1px solid #38bdf8;}
        .btn-team:hover { background: #2563eb; }

        /* Spikri ja Admini paneel */
        .admin-panel { text-align: left; }
        .admin-panel h2 { color: var(--gold); text-align: center; font-family: 'Cinzel'; margin-top:0; }
        .admin-cat-block {
            background: rgba(30, 58, 138, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid rgba(223, 179, 66, 0.3);
        }
        .admin-input {
            width: 100%;
            background: #061121;
            border: 1px solid var(--gold);
            color: white;
            padding: 8px;
            border-radius: 4px;
            margin-top: 4px;
            margin-bottom: 10px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .admin-q-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            align-items: center;
        }
        .admin-q-row input { margin: 0; }

        /* Host Sheet Table */
        .host-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .host-table th, .host-table td {
            border: 1px solid rgba(223, 179, 66, 0.3);
            padding: 8px 12px;
            font-size: 0.9rem;
        }
        .host-table th { background: rgba(30, 58, 138, 0.4); color: var(--gold); }
        .host-ans { color: #5cf161; font-weight: bold; }
    </style>
</head>

<body>

    <canvas id="bgCanvas"></canvas>

    <div class="top-bar">
        <a href="index.html" class="ctrl-btn" style="text-decoration:none; display:inline-flex; align-items:center;" title="Tagasi mängude nimekirja">⬅ Mängud</a>

        <!-- Fontide suuruse muutmise nupud -->
        <div class="font-controls">
            <span style="color: var(--gold); font-size: 0.8rem; margin-right: 4px;">Tekst:</span>
            <button class="font-btn" onclick="changeFontSize(-0.1)" title="Vähenda fontide suurust">A-</button>
            <button class="font-btn" onclick="resetFontSize()" title="Taasta algne suurus">A</button>
            <button class="font-btn" onclick="changeFontSize(0.1)" title="Suurenda fontide suurust">A+</button>
        </div>

        <span id="saveStatus" style="color: var(--accent-cyan); font-size: 0.8rem; margin-right: 8px;"></span>
        <button class="ctrl-btn" id="musicBtn" onclick="toggleMusic()">🎵 Muusika</button>
        <button class="ctrl-btn" id="hostBtn" onclick="toggleHostView()">🔒 Host Režiim</button>
        <button class="ctrl-btn" onclick="openAdminModal()">⚙️ Muuda Küsimusi</button>
    </div>

    <h1>🏆 <span id="gameTitle">KULDVILLAK</span> 🏆</h1>

    <div class="board" id="board"></div>

    <div class="scoreboard-container">
        <div class="team-management-tools">
            <button class="btn-sm" onclick="addTeam()">+ Lisa meeskond</button>
            <button class="btn-sm" onclick="removeTeam()">- Eemalda meeskond</button>
            <button class="btn-sm" onclick="resetGame()" style="border-color: var(--accent-red); color: #ff8888;">🔄 Taasta algseis</button>
        </div>
        <div class="scoreboard" id="scoreboard"></div>
    </div>

    <!-- Küsimuse Aken -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalBox">
            <div class="modal-category" id="modalCategory">Kategooria</div>
            <div class="modal-points" id="modalPoints">100</div>
            <div class="modal-question" id="modalQuestion">Küsimus...</div>
            <div class="modal-answer" id="modalAnswer">Vastus: ...</div>
            
            <div id="controlsContainer">
                <button class="btn" id="showAnswerBtn" onclick="toggleAnswer()">Näita Vastust</button>
                <button class="btn btn-close" onclick="closeModal()">Sulge</button>
            </div>

            <div class="award-buttons" id="awardButtons"></div>
        </div>
    </div>

    <!-- Host Spikker Modal (Kiirvaade vastustest) -->
    <div class="modal-overlay" id="hostModalOverlay">
        <div class="modal admin-panel" id="hostModalBox">
            <h2>📜 Hosti Vastuste Spikker</h2>
            <p style="text-align: center; color: #a0aab8; font-size: 0.9rem;">
                Siin näed korraga kõiki vastuseid juhtimiseks teisest seadmest.
            </p>

            <div id="hostCheatSheet"></div>

            <div style="text-align: center; margin-top: 20px;">
                <button class="btn" onclick="closeHostModal()">Sulge Spikker</button>
            </div>
        </div>
    </div>

    <!-- Redigeerimise / Edit Modal -->
    <div class="modal-overlay" id="adminModalOverlay">
        <div class="modal admin-panel" id="adminModalBox">
            <h2>⚙️ Küsimuste & Kategooriate Muutmine</h2>
            
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; background: rgba(30, 58, 138, 0.3); padding: 10px; border-radius: 6px; border: 1px solid rgba(56, 189, 248, 0.3);">
                <label><input type="checkbox" id="syncCheck" onchange="toggleSync(this.checked)"> 🔄 Reaalajas Sünkroniseerimine</label>
                <div style="display: flex; gap: 6px;">
                    <button class="btn-sm" onclick="exportData()" title="Lae küsimused JSON-failina alla">📥 Export</button>
                    <button class="btn-sm" onclick="triggerImport()" title="Lae küsimused JSON-failist sisse">📤 Import</button>
                    <input type="file" id="importInput" accept=".json" style="display: none;" onchange="importData(event)">
                    <button class="btn-sm" onclick="addNewCategory()">+ Lisa Kategooria</button>
                </div>
            </div>

            <div id="adminCategoriesContainer"></div>

            <div style="text-align: center; margin-top: 20px;">
                <button class="btn" onclick="saveAdminChanges()">Salvesta ja Sulge</button>
            </div>
        </div>
    </div>

    <script>
        // --- VAIKIMISI KÕIK 5 KATEGOORIAT ---
const defaultGameData = [
            {
                category: "Tehnika & Liiklus",
                questions: [
                    { points: 100, q: "Mis akronüümi kannab pidurisüsteem, mis takistab rataste lukustumist?", a: "ABS" },
                    { points: 200, q: "Milline legendaarne mudel oli Saksa 'rahvaauto' esimeseks sümboliks?", a: "Põrnikas (Beetle)" },
                    { points: 300, q: "Seade, mis muudab heitgaaside surve lisavõimsuseks?", a: "Turbo" },
                    { points: 400, q: "Millise Itaalia auto jooniste põhjal ehitati esimene Žiguli?", a: "Fiat" },
                    { points: 500, q: "Mehhanism, mis võimaldab ratastel kurvis eri kiirusega pöörelda?", a: "Diferentsiaal" }
                ]
            },
            {
                category: "Toit & Küpsetised",
                questions: [
                    { points: 100, q: "Itaaliapärane ümmargune küpsetis tomatikastme ja juustuga?", a: "Pitsa" },
                    { points: 200, q: "Jaapani/Aasia tehnika pehme pärmitaigna saamiseks (jahu-vee pudru keetmine)?", a: "Tangzhong" },
                    { points: 300, q: "Maailma kalleim vürts, mida korjatakse krookuse õitest?", a: "Safran" },
                    { points: 400, q: "Eesti traditsiooniline põimitud pärmitaignast pidusaia vorm?", a: "Kringel" },
                    { points: 500, q: "Reaktsioon aminohapete ja suhkrute vahel liha pruunistumisel?", a: "Maillard'i reaktsioon" }
                ]
            },
            {
                category: "Piibel & Usundid",
                questions: [
                    { points: 100, q: "Islami kõige püham linn?", a: "Meka" },
                    { points: 200, q: "Mitu raamatut on protestantlikus Piiblis kokku?", a: "66" },
                    { points: 300, q: "Kes oli Piibli andmetel vanimaks elanud inimene (969 a)?", a: "Metuusalah" },
                    { points: 400, q: "Mis on maailma väikseim iseseisev riik ja Katoliku kiriku keskus?", a: "Vatikan" },
                    { points: 500, q: "Mis kolmes keeles kirjutati Piibli algtekstid?", a: "Hebrea, Kreeka, Aramea" }
                ]
            },
            {
                category: "Mängud & Meelelahutus",
                questions: [
                    { points: 100, q: "Mis arvutimängus ehitatakse plokkidest maailmu ja võideldakse Creeperitega?", a: "Minecraft" },
                    { points: 200, q: "Populaarne ulmesari, kus reisiti läbi täheväravate?", a: "Stargate SG-1" },
                    { points: 300, q: "Mitu kaardimasti on tavalises mängukaartide pakis?", a: "4" },
                    { points: 400, q: "Millises klassikalises lauamängus ostetakse kinnisvara, ehitatakse maju ja hotelle?", a: "Monopoly" },
                    { points: 500, q: "Mis on täpse noolemängu (darts) maksimaalne võimalik skoor kolme noolega?", a: "180" }
                ]
            },
            {
                category: "Sünnipäevalaps",
                questions: [
                    { points: 100, q: "Sünnipäevalapse kõige esimene isiklik auto?", a: "Mazda 6" },
                    { points: 200, q: "Mis on üks levinud jook, mida Hendrik pole kunagi proovinud?", a: "Kohv" },
                    { points: 300, q: "Kus riigis käisid Alesja ja Hendrik pulmareisil?", a: "Gruusia" },
                    { points: 400, q: "Mis on ta isikliku FIE nimetus?", a: "Hendrik Jürgenson IT teenused" },
                    { points: 500, q: "Mis on kõige häbiväärsem asi, millega tegelinski Hendrik on hakkama saanud?", a: "1. klassis koju minnes vedel häda" }
                ]
            }
        ];

        // --- POCKETBASE ÜHENDUS ---
        const pb = new PocketBase(window.location.origin);
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('id');
        // Iga salvestatud mäng saab oma localStorage "nimeruumi", et mitu
        // eri Kuldvillaku seadistust ei kirjutaks üksteise ajutist mänguseisu üle.
        const STORAGE_PREFIX = gameId ? `kv_${gameId}_` : 'kv_local_';

        // --- STAATUS JA SALVESTUS ---
        let gameData = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'gameData')) || defaultGameData;
        let teams = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'teams')) || [
            { name: "Meeskond 1", score: 0 },
            { name: "Meeskond 2", score: 0 },
            { name: "Meeskond 3", score: 0 }
        ];
        let disabledCards = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'disabledCards')) || [];
        
        let isHostMode = false;
        let syncInterval = null;
        let currentPoints = 0;
        let activeCardIndex = null;
        let activeCardElement = null;
        let isAnswerRevealed = false; // Jälgib, kas vastust on avatud
        let fontScale = parseFloat(localStorage.getItem(STORAGE_PREFIX + 'fontScale')) || 1.0;

        function saveData() {
            localStorage.setItem(STORAGE_PREFIX + 'gameData', JSON.stringify(gameData));
            localStorage.setItem(STORAGE_PREFIX + 'teams', JSON.stringify(teams));
            localStorage.setItem(STORAGE_PREFIX + 'disabledCards', JSON.stringify(disabledCards));
            localStorage.setItem(STORAGE_PREFIX + 'fontScale', fontScale);
        }

        // Laeb salvestatud küsimused/kategooriad PocketBase'ist, kui mäng avati
        // portaalist (?id=... URL-is). Ilma id-ta töötab fail jätkuvalt
        // iseseisvalt, kohaliku vaikeandmestikuga (nt kiireks testimiseks).
        async function loadFromPocketBase() {
            if (!gameId) return;
            const statusEl = document.getElementById('saveStatus');
            try {
                const record = await pb.collection('games').getOne(gameId);
                document.getElementById('gameTitle').innerText = record.title || 'KULDVILLAK';
                if (Array.isArray(record.data) && record.data.length > 0) {
                    gameData = record.data;
                    saveData();
                    renderBoard();
                    renderAdminPanel();
                }
            } catch (err) {
                console.error(err);
                if (statusEl) statusEl.innerText = '⚠️ Salvestatud seadistuse laadimine ebaõnnestus';
            }
        }

        // Saadab hetke küsimused/kategooriad PocketBase'i tagasi. Kutsutakse
        // ainult siis, kui host reaalselt "Salvesta ja Sulge" vajutab —
        // meeskondade skoore ega hetke mänguseisu backend'i ei saadeta,
        // need jäävad selle arvuti localStorage'isse (ajutine mänguseis).
        async function saveToPocketBase() {
            if (!gameId) return;
            const statusEl = document.getElementById('saveStatus');
            try {
                if (statusEl) statusEl.innerText = '💾 Salvestan...';
                await pb.collection('games').update(gameId, { data: gameData });
                if (statusEl) {
                    statusEl.innerText = '✅ Salvestatud';
                    setTimeout(() => { statusEl.innerText = ''; }, 2500);
                }
            } catch (err) {
                console.error(err);
                if (statusEl) statusEl.innerText = '⚠️ Salvestamine ebaõnnestus';
            }
        }

        // --- IMPORT / EXPORT FUNKTSIOONID ---
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(gameData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "kuldvillak_kysimused.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function triggerImport() {
            document.getElementById('importInput').click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported) && imported.length > 0 && imported[0].category && imported[0].questions) {
                        gameData = imported;
                        saveData();
                        renderAdminPanel();
                        renderBoard();
                        alert("Mänguandmed edukalt imporditud!");
                    } else {
                        alert("Vigane failivorming! Veendu, et tegemist on õige Kuldvillaku JSON-failiga.");
                    }
                } catch (err) {
                    alert("Viga faili lugemisel: " + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // Nullime sisendi
        }

        // --- FONTI DE SUURUSE JUHTIMINE ---
        function applyFontScale() {
            document.documentElement.style.setProperty('--font-scale', fontScale);
            saveData();
        }

        function changeFontSize(delta) {
            fontScale = Math.min(Math.max(0.7, fontScale + delta), 1.6);
            applyFontScale();
        }

        function resetFontSize() {
            fontScale = 1.0;
            applyFontScale();
        }

        // --- HOST REŽIIM & SPIKKER ---
        function toggleHostView() {
            if (!isHostMode) {
                const pass = prompt("Sisesta Host/Admin parool:");
                if (pass === "admin") {
                    isHostMode = true;
                    document.body.classList.add('host-active');
                    document.getElementById('hostBtn').innerText = "🔓 Host Aktiivne (Välju)";
                    document.getElementById('hostBtn').style.background = "var(--gold)";
                    document.getElementById('hostBtn').style.color = "black";
                    openHostCheatSheet();
                } else if (pass !== null) {
                    alert("Vale parool!");
                }
            } else {
                isHostMode = false;
                document.body.classList.remove('host-active');
                document.getElementById('hostBtn').innerText = "🔒 Host Režiim";
                document.getElementById('hostBtn').style.background = "rgba(10, 25, 47, 0.85)";
                document.getElementById('hostBtn').style.color = "var(--gold)";
            }
        }

        function openHostCheatSheet() {
            const container = document.getElementById('hostCheatSheet');
            let html = '<table class="host-table"><thead><tr><th>Kat</th><th>Pkt</th><th>Küsimus</th><th>Vastus</th></tr></thead><tbody>';

            gameData.forEach(cat => {
                cat.questions.forEach(q => {
                    html += `
                        <tr>
                            <td><b>${cat.category}</b></td>
                            <td>${q.points}</td>
                            <td>${q.q}</td>
                            <td class="host-ans">${q.a}</td>
                        </tr>
                    `;
                });
            });

            html += '</tbody></table>';
            container.innerHTML = html;

            const overlay = document.getElementById('hostModalOverlay');
            const modalBox = document.getElementById('hostModalBox');
            overlay.style.display = 'flex';
            setTimeout(() => { overlay.style.opacity = '1'; modalBox.classList.add('show'); }, 10);
        }

        function closeHostModal() {
            const overlay = document.getElementById('hostModalOverlay');
            const modalBox = document.getElementById('hostModalBox');
            overlay.style.opacity = '0';
            modalBox.classList.remove('show');
            setTimeout(() => { overlay.style.display = 'none'; }, 250);
        }

        // --- REDIGEERIMISE PANEEL (EDITING) ---
        function openAdminModal() {
            const pass = prompt("Sisesta parool muutmiseks:");
            if (pass !== "admin") {
                if (pass !== null) alert("Vale parool!");
                return;
            }
            renderAdminPanel();
            const overlay = document.getElementById('adminModalOverlay');
            const modalBox = document.getElementById('adminModalBox');
            overlay.style.display = 'flex';
            setTimeout(() => { overlay.style.opacity = '1'; modalBox.classList.add('show'); }, 10);
        }

        function renderAdminPanel() {
            const container = document.getElementById('adminCategoriesContainer');
            container.innerHTML = '';

            gameData.forEach((cat, cIdx) => {
                const block = document.createElement('div');
                block.className = 'admin-cat-block';
                
                let qHtml = '';
                cat.questions.forEach((q, qIdx) => {
                    qHtml += `
                        <div class="admin-q-row">
                            <b style="color:var(--gold); width: 50px;">${q.points}p:</b>
                            <input type="text" class="admin-input" value="${escapeHtml(q.q)}" onchange="updateQText(${cIdx}, ${qIdx}, 'q', this.value)" placeholder="Küsimus">
                            <input type="text" class="admin-input" value="${escapeHtml(q.a)}" onchange="updateQText(${cIdx}, ${qIdx}, 'a', this.value)" placeholder="Vastus" style="color: #5cf161;">
                            <button class="btn-sm" style="background:var(--accent-red); color:white; border:none;" onclick="removeQuestion(${cIdx}, ${qIdx})">X</button>
                        </div>
                    `;
                });

                block.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <input type="text" class="admin-input" value="${escapeHtml(cat.category)}" onchange="updateCatName(${cIdx}, this.value)" style="font-weight:bold; font-size:1.1rem; width:70%;">
                        <div>
                            <button class="btn-sm" onclick="addQuestionToCat(${cIdx})">+ Küsimus</button>
                            <button class="btn-sm" style="background:var(--accent-red); color:white; border:none;" onclick="removeCategory(${cIdx})">Kustuta Kat</button>
                        </div>
                    </div>
                    ${qHtml}
                `;
                container.appendChild(block);
            });
        }

        function escapeHtml(str) { return String(str).replace(/"/g, '&quot;'); }
        function updateCatName(cIdx, val) { gameData[cIdx].category = val; saveData(); renderBoard(); }
        function updateQText(cIdx, qIdx, field, val) { gameData[cIdx].questions[qIdx][field] = val; saveData(); renderBoard(); }
        
        function addQuestionToCat(cIdx) {
            const lastPts = gameData[cIdx].questions.length > 0 ? gameData[cIdx].questions[gameData[cIdx].questions.length - 1].points + 100 : 100;
            gameData[cIdx].questions.push({ points: lastPts, q: "Uus küsimus", a: "Uus vastus" });
            saveData(); renderAdminPanel(); renderBoard();
        }

        function removeQuestion(cIdx, qIdx) {
            gameData[cIdx].questions.splice(qIdx, 1);
            saveData(); renderAdminPanel(); renderBoard();
        }

        function addNewCategory() {
            gameData.push({
                category: "Uus Kategooria",
                questions: [
                    { points: 100, q: "Küsimus 1", a: "Vastus 1" },
                    { points: 200, q: "Küsimus 2", a: "Vastus 2" }
                ]
            });
            saveData(); renderAdminPanel(); renderBoard();
        }

        function removeCategory(cIdx) {
            if (confirm("Kustutada terve kategooria?")) {
                gameData.splice(cIdx, 1);
                saveData(); renderAdminPanel(); renderBoard();
            }
        }

        function saveAdminChanges() {
            saveData();
            saveToPocketBase();
            const overlay = document.getElementById('adminModalOverlay');
            const modalBox = document.getElementById('adminModalBox');
            overlay.style.opacity = '0';
            modalBox.classList.remove('show');
            setTimeout(() => { overlay.style.display = 'none'; }, 250);
        }

        function toggleSync(enabled) {
            if (enabled) {
                syncInterval = setInterval(() => {
                    gameData = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'gameData')) || gameData;
                    teams = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'teams')) || teams;
                    disabledCards = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'disabledCards')) || disabledCards;
                    renderBoard();
                    renderScoreboard();
                }, 1000);
            } else {
                clearInterval(syncInterval);
            }
        }

        // --- MÄNGULAUA JOONISTAMINE ---
        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';

            const numCols = gameData.length;
            board.style.gridTemplateColumns = `repeat(${numCols}, 1fr)`;

            // Headers
            gameData.forEach(cat => {
                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerText = cat.category;
                board.appendChild(header);
            });

            // Arvutame maksimaalse ridade arvu
            let maxRows = 0;
            gameData.forEach(c => { if(c.questions.length > maxRows) maxRows = c.questions.length; });

            for (let row = 0; row < maxRows; row++) {
                for (let col = 0; col < numCols; col++) {
                    const qData = gameData[col].questions[row];
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const cardId = `${col}_${row}`;

                    if (qData) {
                        card.innerText = qData.points;
                        
                        // Admin preview
                        const preview = document.createElement('div');
                        preview.className = 'admin-answer-preview';
                        preview.innerText = `V: ${qData.a}`;
                        card.appendChild(preview);

                        if (disabledCards.includes(cardId)) {
                            card.classList.add('disabled');
                        }

                        card.onclick = () => openQuestion(card, cardId, gameData[col].category, qData.q, qData.a, qData.points);
                    } else {
                        card.classList.add('disabled');
                    }

                    board.appendChild(card);
                }
            }
        }

        // --- SKOORITABELI JUHTIMINE ---
        function renderScoreboard() {
            const container = document.getElementById('scoreboard');
            container.innerHTML = '';
            teams.forEach((team, index) => {
                const teamDiv = document.createElement('div');
                teamDiv.className = 'team';
                teamDiv.innerHTML = `
                    <div class="team-name" contenteditable="true" onblur="updateTeamName(${index}, this.innerText)">${team.name}</div>
                    <div class="team-score" id="score-${index}">${team.score}</div>
                    <div class="team-controls">
                        <button onclick="updateScore(${index}, -100)">-</button>
                        <button onclick="updateScore(${index}, 100)">+</button>
                    </div>
                `;
                container.appendChild(teamDiv);
            });
        }

        function updateTeamName(index, newName) {
            if (newName.trim() !== '') {
                teams[index].name = newName.trim();
                saveData();
            }
        }

        function updateScore(teamIndex, change) {
            teams[teamIndex].score += change;
            saveData();
            renderScoreboard();
        }

        function addTeam() {
            teams.push({ name: `Meeskond ${teams.length + 1}`, score: 0 });
            saveData(); renderScoreboard();
        }

        function removeTeam() {
            if (teams.length > 1) {
                teams.pop();
                saveData(); renderScoreboard();
            }
        }

        function resetGame() {
            if (confirm("Kas soovid tõesti algatada uue mängu? Kõik skoorid ja avatud kaardid nullitakse.")) {
                disabledCards = [];
                teams.forEach(t => t.score = 0);
                saveData();
                renderBoard();
                renderScoreboard();
            }
        }

        // --- KÜSIMUSE AVAMINE & SULGEMINE ---
        function openQuestion(cardElement, cardId, category, question, answer, points) {
            if (cardElement.classList.contains('disabled') && !isHostMode) return;
            
            activeCardIndex = cardId;
            activeCardElement = cardElement;
            currentPoints = points;
            isAnswerRevealed = false; // Nullime vaatamise oleku
            
            document.getElementById('modalCategory').innerText = category;
            document.getElementById('modalPoints').innerText = currentPoints + " PUNKTI";
            document.getElementById('modalQuestion').innerText = question;
            document.getElementById('modalAnswer').innerText = "Vastus: " + answer;
            
            document.getElementById('modalAnswer').style.display = 'none';
            document.getElementById('awardButtons').style.display = 'none';
            document.getElementById('controlsContainer').style.display = 'block';
            document.getElementById('showAnswerBtn').style.display = 'inline-block';
            
            const overlay = document.getElementById('modalOverlay');
            const modalBox = document.getElementById('modalBox');
            overlay.style.display = 'flex';
            
            setTimeout(() => {
                overlay.style.opacity = '1';
                modalBox.classList.add('show');
            }, 10);
        }

        function toggleAnswer() {
            isAnswerRevealed = true; // Vastus on nüüd vaadatud!
            document.getElementById('modalAnswer').style.display = 'block';
            document.getElementById('showAnswerBtn').style.display = 'none';
            
            const awardContainer = document.getElementById('awardButtons');
            awardContainer.innerHTML = '<p style="width: 100%; margin: 5px 0 10px 0; color: #a0aab8;">Kellele anname punktid?</p>';
            
            teams.forEach((team, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-team';
                btn.innerText = team.name;
                btn.onclick = () => awardPoints(index);
                awardContainer.appendChild(btn);
            });

            const noOneBtn = document.createElement('button');
            noOneBtn.className = 'btn btn-close';
            noOneBtn.innerText = 'Keegi ei saanud';
            noOneBtn.onclick = closeModal;
            awardContainer.appendChild(noOneBtn);

            awardContainer.style.display = 'flex';
            document.getElementById('controlsContainer').style.display = 'none';
        }

        function awardPoints(teamIndex) {
            updateScore(teamIndex, currentPoints);
            confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
            setTimeout(closeModal, 1000);
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            const modalBox = document.getElementById('modalBox');
            
            overlay.style.opacity = '0';
            modalBox.classList.remove('show');
            
            setTimeout(() => {
                overlay.style.display = 'none';
                
                if (isAnswerRevealed && activeCardIndex && !disabledCards.includes(activeCardIndex)) {
                    disabledCards.push(activeCardIndex);
                    saveData();
                    renderBoard();
                }
            }, 250);
        }

        // --- TAUSTA ANIMATSIOON (3D NEBULA TUME-SINISTE JA KULDSETE TÄHTEDEGA) ---
        function initNebula() {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            let w = canvas.width = window.innerWidth;
            let h = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            });

            const stars = Array.from({length: 180}, () => ({
                x: (Math.random() - 0.5) * w * 2,
                y: (Math.random() - 0.5) * h * 2,
                z: Math.random() * w,
                size: Math.random() * 2 + 1,
                colorType: Math.random() > 0.4 ? 'gold' : 'blue'
            }));

            function draw() {
                ctx.fillStyle = '#030a16';
                ctx.fillRect(0, 0, w, h);

                stars.forEach(s => {
                    s.z -= 0.6;
                    if (s.z <= 0) s.z = w;

                    const k = 400 / s.z;
                    const px = s.x * k + w / 2;
                    const py = s.y * k + h / 2;

                    if (px >= 0 && px <= w && py >= 0 && py <= h) {
                        const sz = Math.max(0.1, (1 - s.z / w) * s.size * 2);
                        const alpha = 1 - s.z / w;
                        ctx.beginPath();
                        ctx.arc(px, py, sz, 0, Math.PI * 2);
                        ctx.fillStyle = s.colorType === 'gold' 
                            ? `rgba(223, 179, 66, ${alpha})` 
                            : `rgba(56, 189, 248, ${alpha})`;
                        ctx.fill();
                    }
                });
                requestAnimationFrame(draw);
            }
            draw();
        }

        // Taustamuusika
        let isMusicPlaying = false;
        const bgMusic = new Audio('sims.mp3');
        bgMusic.loop = true;

        function toggleMusic() {
            if (isMusicPlaying) {
                bgMusic.pause();
                document.getElementById('musicBtn').innerText = "🎵 Muusika";
            } else {
                bgMusic.play().then(() => {
                    document.getElementById('musicBtn').innerText = "🎶 Mängib";
                }).catch(() => alert("Veendu, et 'sims.mp3' fail on samas kaustas!"));
            }
            isMusicPlaying = !isMusicPlaying;
        }

        window.onload = () => {
            applyFontScale();
            renderBoard();
            renderScoreboard();
            initNebula();
            loadFromPocketBase();
        };
    </script>
