services:
  pocketbase:
    build:
      context: .
      dockerfile: pb/Dockerfile
    container_name: ohtu-pb
    restart: unless-stopped
    ports:
      # Ainult hostist ligipääsetav; frontend kasutab PocketBase'i konteinerivõrgu kaudu (/pb)
      - "127.0.0.1:8090:8090"
    volumes:
      - pb_data:/pb_data
    # CRITICAL: args must start with "-" so entrypoint still runs superuser upsert
    # and then: pocketbase serve --dir=/pb_data ... --migrationsDir=/pb_migrations
    command:
      - --migrationsDir=/pb_migrations
      - --hooksDir=/pb_hooks
    environment:
      # Vaikeparooli pole: esimesel külastusel /admin lehel määrad ise e-posti ja parooli.
      # Soovi korral saab PB_ADMIN_EMAIL / PB_ADMIN_PASSWORD anda hostikeskkonnast (edastatakse ainult kui on seatud).
      - PB_ADMIN_EMAIL
      - PB_ADMIN_PASSWORD
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 8s
      timeout: 5s
      retries: 8
      start_period: 25s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ohtu-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BASE_PATH: "/mangud"
      PB_PUBLIC_URL: "${PB_PUBLIC_URL:-/mangud/pb}"
      AI_SETTINGS_DIR: /app/data
    volumes:
      - ai_data:/app/data
    depends_on:
      pocketbase:
        condition: service_healthy

volumes:
  pb_data:
  ai_data:
