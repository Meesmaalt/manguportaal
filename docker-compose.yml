services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: ohtu-pb
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb_data
      - ./pb/pb_migrations:/pb_migrations:ro
    # CRITICAL: args must start with "-" so entrypoint still runs superuser upsert
    # and then: pocketbase serve --dir=/pb_data ... --migrationsDir=/pb_migrations
    command:
      - --migrationsDir=/pb_migrations
    environment:
      # muchobien entrypoint: superuser upsert on start
      PB_ADMIN_EMAIL: "${PB_ADMIN_EMAIL:-admin@ohtu.local}"
      PB_ADMIN_PASSWORD: "${PB_ADMIN_PASSWORD:-ohtu123456}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 8s
      timeout: 5s
      retries: 8
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: "/mangud/"
    container_name: ohtu-web
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      BASE_PATH: "/mangud"
      PB_PUBLIC_URL: "${PB_PUBLIC_URL:-/mangud/pb}"
    depends_on:
      pocketbase:
        condition: service_healthy

volumes:
  pb_data:
