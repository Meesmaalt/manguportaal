services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: ohtu-pb
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb_data
      - ./pb/pb_migrations:/pb_migrations:ro
    environment:
      PB_ADMIN_EMAIL: admin@ohtu.local
      PB_ADMIN_PASSWORD: ohtu123456
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 8s
      timeout: 5s
      retries: 8
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: "/mangud/"
    container_name: ohtu-web
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      BASE_PATH: "/mangud"
      # Brauser peab PB-ni jõudma. Vaikimisi proovi sama hosti /mangud/pb proksit.
      # Kui 404, sea .env-is otse: PB_PUBLIC_URL=https://tools.thormen.com:8090
      PB_PUBLIC_URL: "${PB_PUBLIC_URL:-/mangud/pb}"
    depends_on:
      pocketbase:
        condition: service_healthy

volumes:
  pb_data:
