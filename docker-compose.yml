services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: ohtu-pb
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb_data
      # Migratsioonid käivituvad automaatselt esimesel stardil
      - ./pb/pb_migrations:/pb_migrations:ro
    environment:
      PB_ADMIN_EMAIL: admin@ohtu.local
      PB_ADMIN_PASSWORD: ohtu123456
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 8s
      timeout: 5s
      retries: 8
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ohtu-web
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      # Brauser räägib PocketBase'iga läbi nginx proksi /pb (CORS pole vaja)
      PB_PUBLIC_URL: /pb
    depends_on:
      pocketbase:
        condition: service_healthy

volumes:
  pb_data:
