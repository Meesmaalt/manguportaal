services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: ohtu-pb
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb_data
      - ./pb/pb_migrations:/pb_migrations:ro
    environment:
      PB_ADMIN_EMAIL: admin@ohtu.local
      PB_ADMIN_PASSWORD: ohtu123456
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 8s
      timeout: 5s
      retries: 8
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build-time: './' = suhtelised assetid (soovitatav alamtee jaoks)
        VITE_BASE_PATH: "./"
    container_name: ohtu-web
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      # Runtime: alamtee kui reverse proxy paneb nt /mangud alla
      # Näide: BASE_PATH=/mangud
      BASE_PATH: "${BASE_PATH:-}"
      # PocketBase URL brauserile. Tühi = BASE_PATH/pb või /pb
      # Näide otse: PB_PUBLIC_URL=http://192.168.88.28:8090
      # Näide proksi: PB_PUBLIC_URL=/mangud/pb
      PB_PUBLIC_URL: "${PB_PUBLIC_URL:-}"
    depends_on:
      pocketbase:
        condition: service_healthy

volumes:
  pb_data:
